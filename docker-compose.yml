services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: vwengenharia
      POSTGRES_USER: vw
      POSTGRES_PASSWORD: vw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: quay.io/minio/aistor/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-me
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/aistor/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin change-me; do sleep 2; done;
      mc mb --ignore-existing local/vwengenharia;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data:
