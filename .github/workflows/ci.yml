name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vwengenharia
          POSTGRES_USER: vw
          POSTGRES_PASSWORD: vw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vw -d vwengenharia"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vw:vw@localhost:5432/vwengenharia
      JWT_SECRET: test-secret-must-have-at-least-32-bytes-long
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests scripts alembic
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
