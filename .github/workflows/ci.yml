name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vwengenharia
          POSTGRES_USER: vw
          POSTGRES_PASSWORD: vw
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vw -d vwengenharia"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://vw:vw@localhost:5432/vwengenharia
      JWT_SECRET: test-secret-must-have-at-least-32-bytes-long
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check app tests scripts alembic
      - run: alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build


  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate application compose
        run: docker compose --env-file .env.production.example -f docker-compose.app.yml config > /dev/null
      - name: Build backend image
        run: docker build -t vwengenharia-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t vwengenharia-frontend:ci ./frontend
      - name: Validate Windows launcher syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./scripts/start-homologation.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "./scripts/stop-homologation.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }


  homologation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate homologation compose
        run: docker compose --env-file .env.homologation.example -f docker-compose.app.yml -f docker-compose.homologation.yml config > /dev/null
      - name: Start homologation stack
        run: |
          docker compose --env-file .env.homologation.example -f docker-compose.app.yml -f docker-compose.homologation.yml up -d --build postgres redis s3mock migrate backend frontend
      - name: Seed homologation data
        run: |
          docker compose --env-file .env.homologation.example -f docker-compose.app.yml -f docker-compose.homologation.yml run --rm seed
          docker compose --env-file .env.homologation.example -f docker-compose.app.yml -f docker-compose.homologation.yml run --rm seed
      - name: Smoke test homologation stack
        env:
          BASE_URL: http://127.0.0.1:18080
          HOMOLOGATION_PASSWORD: Homologacao-VW-2026!
          HOMOLOGATION_ADMIN_EMAIL: gestor.homologacao@example.com
          HOMOLOGATION_TECH_EMAIL: tecnico.homologacao@example.com
        run: sh scripts/smoke_homologation.sh
      - name: Show compose logs on failure
        if: failure()
        run: docker compose --env-file .env.homologation.example -f docker-compose.app.yml -f docker-compose.homologation.yml logs --no-color
      - name: Stop homologation stack
        if: always()
        run: docker compose --env-file .env.homologation.example -f docker-compose.app.yml -f docker-compose.homologation.yml down -v
